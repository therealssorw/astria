[plugin]

name="Grass Brush"
description="Paint grass onto terrain in the editor. Add a GrassPaint node to the scene, select it, then left-drag in the viewport to paint, Shift+drag to erase, [ and ] to resize the brush. All blades go into a single MultiMesh so painting stays one draw call."
author="Astria"
version="1.0"
script="grass_brush_plugin.gd"
